services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: ops-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft single-node (combined controller + broker)
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@localhost:9094"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9094,INTERNAL://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Reduce the size of the __consumer_offsets topic for single-node dev
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-api:
    build:
      context: .
      dockerfile: order-api/Dockerfile
    container_name: ops-order-api
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9093"
      ORDER_API_PORT: "6080"
    ports:
      - "6080:6080"

  fulfillment-service:
    build:
      context: .
      dockerfile: fulfillment-service/Dockerfile
    container_name: ops-fulfillment
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9093"

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: ops-notifications
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9093"
